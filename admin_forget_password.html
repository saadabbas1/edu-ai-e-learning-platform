<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password | Edu AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .auth-box {
      position: relative;
      width: 100%;
      max-width: 400px;
      background: #fff;
      padding: 3rem 2rem 2rem 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    .form-title {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #007bff;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 0.9rem 1rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 10px;
      transition: border-color 0.3s ease;
      margin-bottom: 0.5rem;
    }
    input:focus {
      border-color: #007bff;
      outline: none;
    }

    .password-group {
        position: relative;
        display: flex;
        align-items: center;
    }

    .password-group input {
        width: 100%;
        padding-right: 60px;
    }

    .toggle-btn {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        color: #007bff;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        height: 100%;
    }

    .toggle-btn:hover {
        color: #0056b3;
    }

    button {
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
      user-select: none;
      border: none;
      padding: 0.9rem;
      box-sizing: border-box;
    }
    .button-primary {
      background-color: #007bff;
      color: #fff;
      width: 100%;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }
    .button-primary:hover {
      background-color: #0056b3;
    }
    .back-button {
      position: absolute;
      top: 16px;
      left: 16px;
      background: none;
      color: #007bff;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 10px;
      padding: 0.5rem 0.9rem;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
    }
    .back-button:hover {
      background-color: #e6f0ff;
      color: #0056b3;
      transform: translateX(-2px);
    }
    .message {
      font-size: 0.9rem;
      min-height: 1.2em;
      margin-top: 0.25rem;
      margin-bottom: 0.8rem;
    }
    .message.error {
      color: #dc3545;
    }
    .message.success {
      color: #28a745;
    }
    .message.warning {
      color: #fd7e14;
    }
    #passwordStrength {
      margin-bottom: 0.5rem;
    }
    #passwordMatch {
      margin-bottom: 1rem;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Email Form -->
  <div class="auth-box" id="emailBox">
    <button class="back-button" onclick="goBackToLogin()">← Back</button>
    <p class="form-title">Reset Password</p>
    <input type="email" id="resetEmail" placeholder="Enter your email" required />
    <div id="emailMessage" class="message"></div>
    <button class="button-primary" id="emailSubmitBtn">Submit</button>
  </div>

  <!-- OTP Form -->
  <div class="auth-box hidden" id="otpBox">
    <button class="back-button" onclick="goBackToEmail()">← Back</button>
    <p class="form-title">Enter OTP</p>
    <input type="text" id="otpInput" placeholder="Enter the OTP sent to your email" required />
    <div id="otpMessage" class="message"></div>
    <button class="button-primary" id="otpConfirmBtn">Confirm</button>
  </div>

  <!-- Password Reset Form -->
  <div class="auth-box hidden" id="passwordBox">
    <button class="back-button" onclick="goBackToOTP()">← Back</button>
    <p class="form-title">Set New Password</p>
    
    <div class="password-group">
        <input type="password" id="newPassword" name="newPassword" placeholder="New Password" required />    
        <button type="button" class="toggle-btn" onclick="togglePassword('newPassword', this)">Show</button>
    </div>
    <div id="passwordStrength" class="message"></div>
    
    <div class="password-group">
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required />
        <button type="button" class="toggle-btn" onclick="togglePassword('confirmPassword', this)">Show</button>
    </div class="password-group">
    <div id="passwordMatch" class="message"></div>
    <div id="passwordMessage" class="message"></div>
    <button class="button-primary" id="passwordSaveBtn">Save</button>
  </div>

  <script>

    function togglePassword(fieldId, btn) {
        const input = document.getElementById(fieldId);
        
        if (input.type === "password") {
            input.type = "text";
            btn.textContent = "Hide";
        } 
        else {
            input.type = "password";
            btn.textContent = "Show";
        }
    }
    // Cached elements
    const emailBox = document.getElementById('emailBox');
    const otpBox = document.getElementById('otpBox');
    const passwordBox = document.getElementById('passwordBox');

    const resetEmailInput = document.getElementById('resetEmail');
    const emailMessage = document.getElementById('emailMessage');
    const emailSubmitBtn = document.getElementById('emailSubmitBtn');

    const otpInput = document.getElementById('otpInput');
    const otpMessage = document.getElementById('otpMessage');
    const otpConfirmBtn = document.getElementById('otpConfirmBtn');

    const newPasswordInput = document.getElementById('newPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const passwordStrength = document.getElementById('passwordStrength');
    const passwordMatch = document.getElementById('passwordMatch');
    const passwordMessage = document.getElementById('passwordMessage');
    const passwordSaveBtn = document.getElementById('passwordSaveBtn');

    // Back buttons
    function goBackToLogin() {
      // Replace with actual navigation to login if needed
      emailMessage.textContent = "Redirecting to login page...";
      emailMessage.className = "message success";
      document.location='admin_login_form.html';
    }

    function goBackToEmail() {
      otpBox.classList.add('hidden');
      emailBox.classList.remove('hidden');
      otpMessage.textContent = "";
      otpInput.value = "";
    }

    function goBackToOTP() {
      passwordBox.classList.add('hidden');
      otpBox.classList.remove('hidden');
      passwordStrength.textContent = "";
      passwordMatch.textContent = "";
      passwordMessage.textContent = "";
      newPasswordInput.value = "";
      confirmPasswordInput.value = "";
    }

    // Validate email and send OTP
    function sendOTP() {
      const email = resetEmailInput.value.trim();
      emailMessage.textContent = "";
      emailMessage.className = "message";

      if (!email) {
        emailMessage.textContent = "Email is required.";
        emailMessage.className = "message error";
        return;
      }
      // Basic email regex
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        emailMessage.textContent = "Please enter a valid email address.";
        emailMessage.className = "message error";
        return;
      }
      emailMessage.textContent = "Sending OTP...";
      emailMessage.className = "message";

      // Simulate async OTP send
      setTimeout(() => {
        emailMessage.textContent = "OTP sent to your email!";
        emailMessage.className = "message success";
        emailBox.classList.add('hidden');
        otpBox.classList.remove('hidden');
        otpInput.value = "";
        otpMessage.textContent = "";
      }, 1000);
    }

    // Verify OTP
    function verifyOTP() {
      const otp = otpInput.value.trim();
      otpMessage.textContent = "";
      otpMessage.className = "message";

      if (!otp) {
        otpMessage.textContent = "Please enter the OTP.";
        otpMessage.className = "message error";
        return;
      }
      // Demo OTP is "123456"
      if (otp !== "123456") {
        otpMessage.textContent = "Invalid OTP. Please try again.";
        otpMessage.className = "message error";
        return;
      }
      otpMessage.textContent = "";
      otpBox.classList.add('hidden');
      passwordBox.classList.remove('hidden');
      newPasswordInput.value = "";
      confirmPasswordInput.value = "";
      passwordStrength.textContent = "";
      passwordMatch.textContent = "";
      passwordMessage.textContent = "";
    }

    // Password strength check
    function checkPasswordStrength(password) {
      const lengthValid = password.length >= 8;
      const upperCaseValid = /[A-Z]/.test(password);
      const numberValid = /\d/.test(password);

      if (lengthValid && upperCaseValid && numberValid) return 'strong';
      if (lengthValid && (upperCaseValid || numberValid)) return 'average';
      return 'weak';
    }

    function updatePasswordStrength() {
      const pwd = newPasswordInput.value;
      if (!pwd) {
        passwordStrength.textContent = "";
        passwordStrength.className = "message";
        return;
      }
      const strength = checkPasswordStrength(pwd);
      passwordStrength.textContent = "Strength: " + strength.charAt(0).toUpperCase() + strength.slice(1);
      passwordStrength.className = "message " + (strength === 'weak' ? "error" : (strength === 'average' ? "warning" : "success"));
    }

    function checkPasswordMatch() {
      const pwd = newPasswordInput.value;
      const confirmPwd = confirmPasswordInput.value;

      if (!confirmPwd) {
        passwordMatch.textContent = "";
        passwordMatch.className = "message";
        return;
      }
      if (pwd === confirmPwd) {
        passwordMatch.textContent = "Passwords match";
        passwordMatch.className = "message success";
      } else {
        passwordMatch.textContent = "Passwords do not match";
        passwordMatch.className = "message error";
      }
    }

    // Save new password
    function saveNewPassword() {
      const pwd = newPasswordInput.value;
      const confirmPwd = confirmPasswordInput.value;
      passwordMessage.textContent = "";
      passwordMessage.className = "message";

      const strength = checkPasswordStrength(pwd);
      if (strength !== 'strong') {
        passwordMessage.textContent = "Password must be at least 8 characters, include one uppercase letter, and one number.";
        passwordMessage.className = "message error";
        return;
      }
      if (pwd !== confirmPwd) {
        passwordMessage.textContent = "Passwords do not match.";
        passwordMessage.className = "message error";
        return;
      }

      passwordMessage.textContent = "Password reset successfully! You can now log in with your new password.";
      passwordMessage.className = "message success";

      // Here you’d save the password and maybe redirect to login:
      // Example:
      // window.location.href = 'login.html';

      // For demo, just clear inputs after 2 sec
      setTimeout(() => {
        passwordBox.classList.add('hidden');
        emailBox.classList.remove('hidden');
        resetEmailInput.value = "";
        emailMessage.textContent = "";
        otpInput.value = "";
        otpMessage.textContent = "";
        newPasswordInput.value = "";
        confirmPasswordInput.value = "";
        passwordStrength.textContent = "";
        passwordMatch.textContent = "";
        passwordMessage.textContent = "";
      }, 2000);
    }

    // Event listeners
    emailSubmitBtn.addEventListener('click', sendOTP);
    otpConfirmBtn.addEventListener('click', verifyOTP);
    passwordSaveBtn.addEventListener('click', saveNewPassword);

    newPasswordInput.addEventListener('input', () => {
      updatePasswordStrength();
      checkPasswordMatch();
    });

    confirmPasswordInput.addEventListener('input', checkPasswordMatch);

  </script>
</body>
</html>
