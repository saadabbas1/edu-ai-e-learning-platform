}

</head>

<body>
  <header class="navbar">
    <div class="navbar-left">
      <a href="admin_dashboard.php">
        <img src="images/Book Logo.png" alt="Edu AI Logo" class="logo">
      </a>
      <span class="brand-name">EDU AI – Admin</span>
    </div>
    <nav class="nav-links">
      <a href="admin_dashboard.php" class="nav-link">Dashboard</a>
    </nav>
  </header>

  <section class="admin-container">
    <section class="section1">
      <h2>User Management</h2>
      <p>Manage users and their study level in the system.</p>
    </section>

    <div style="display: flex; align-items: center; gap: 1rem; margin-top: 2rem;">
  <div class="user-statistics" style="flex-grow: 1;">
    <div class="stat-box total" onclick="filterUsers('All')">
      <h3 id="totalUsers">0</h3>
      <p>Total Users</p>
    </div>

    <div class="stat-box beginner" onclick="filterUsers('Beginner')">
      <h3 id="beginnerCount">0</h3>
      <p>Beginners</p>
    </div>

    <div class="stat-box intermediate" onclick="filterUsers('Intermediate')">
      <h3 id="intermediateCount">0</h3>
      <p>Intermediate</p>
    </div>

    <div class="stat-box advanced" onclick="filterUsers('Advanced')">
      <h3 id="advancedCount">0</h3>
      <p>Advanced</p>
    </div>
  </div>

  <button class="cta-btn add-user-btn" onclick="openUserModal()">+ Add New User</button>
</div>

    <!-- User Table -->
    <table class="user-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Study Level</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="userTable"></tbody>
    </table>
  </section>

  <footer class="eduai-footer">
    <div class="footer-bottom">
      <p>&copy; 2025 EDU AI – Admin Portal</p>
    </div>
  </footer>

  <!-- Add User Modal -->
  <div id="userModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeUserModal()">&times;</span>
      <h2>Add New User</h2>
      <form onsubmit="addUser(event)">
        <label>Name</label>
        <input type="text" id="userName" required />
        <label>Email</label>
        <input type="email" id="userEmail" required />
        <label for="userLevel">Study Level</label>
<select id="userLevel" required>
  <option value="Beginner" class="beginner">Beginner</option>
  <option value="Intermediate" class="intermediate">Intermediate</option>
  <option value="Advanced" class="advanced">Advanced</option>
</select>

        <button type="submit" class="cta-btn" style="margin-top: 1rem;">Add User</button>
      </form>
    </div>
  </div>

  <!-- Edit User Modal -->
  <div id="editUserModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeEditModal()">&times;</span>
      <h2>Edit User</h2>
      <form onsubmit="updateUser(event)">
        <input type="hidden" id="editIndex" />
        <label>Name</label>
        <input type="text" id="editUserName" required />
        <label>Email</label>
        <input type="email" id="editUserEmail" required />
        <label>Study Level</label>
        <select id="editUserLevel" required>
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>
        <button type="submit" class="cta-btn" style="margin-top: 1rem;">Update User</button>
      </form>
    </div>
  </div>

  <script>
let users = []; // will be loaded from server

function levelClass(level) {
  return (level || '').toLowerCase(); // "Beginner" -> "beginner" for your chip classes
}

async function fetchUsers() {
  try {
    const res = await fetch('/edu_ai/admin_users_list.php', { credentials: 'same-origin' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Failed to load users');
    users = data.users || [];
    renderUsers();
    // Update counters from server
    document.getElementById("totalUsers").innerText = data.total ?? users.length;
    document.getElementById("beginnerCount").innerText = data.counts?.Beginner ?? 0;
    document.getElementById("intermediateCount").innerText = data.counts?.Intermediate ?? 0;
    document.getElementById("advancedCount").innerText = data.counts?.Advanced ?? 0;
  } catch (e) {
    console.error(e);
    alert('Could not load users.');
  }
}

function renderUsers() {
  const table = document.getElementById("userTable");
  table.innerHTML = "";
  users.forEach((user, index) => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${escapeHtml(user.name)}</td>
      <td>${escapeHtml(user.email)}</td>
      <td><span class="study-level ${levelClass(user.level)}">${escapeHtml(user.level || '')}</span></td>
      <td class="action-buttons">
        <button class="cta-btn" onclick="editUser(${index})">Edit</button>
        <button class="cta-btn" style="background:red;" onclick="deleteUser(${index})">Delete</button>
      </td>
    `;
    table.appendChild(row);
  });
}

function openUserModal() {
  document.getElementById("userModal").style.display = "block";
}
function closeUserModal() {
  document.getElementById("userModal").style.display = "none";
}

async function addUser(event) {
  event.preventDefault();
  const name  = document.getElementById("userName").value.trim();
  const email = document.getElementById("userEmail").value.trim();
  const level = document.getElementById("userLevel").value;

  if (!name || !email) return;

  const fd = new FormData();
  fd.append('name', name);
  fd.append('email', email);
  fd.append('level', level);

  try {
    const res = await fetch('/edu_ai/admin_user_create.php', { method: 'POST', body: fd, credentials: 'same-origin' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Failed to add user');
    users.unshift(data.user); // add to top
    closeUserModal();
    renderUsers();
    // refresh counters quickly
    fetchUsers();
    // Optionally alert temp password
    if (data.temp_password) alert(`Temporary password for ${data.user.email} is: ${data.temp_password}`);
  } catch (e) {
    console.error(e);
    alert(e.message || 'Could not add user.');
  }
}

function editUser(index) {
  const user = users[index];
  document.getElementById("editIndex").value = index;
  document.getElementById("editUserName").value = user.name;
  document.getElementById("editUserEmail").value = user.email;
  document.getElementById("editUserLevel").value = user.level || 'Beginner';
  document.getElementById("editUserModal").style.display = "block";
}

function closeEditModal() {
  document.getElementById("editUserModal").style.display = "none";
}

async function updateUser(event) {
  event.preventDefault();
  const index = parseInt(document.getElementById("editIndex").value, 10);
  const name  = document.getElementById("editUserName").value.trim();
  const email = document.getElementById("editUserEmail").value.trim();
  const level = document.getElementById("editUserLevel").value;

  const row = users[index];
  if (!row) return;

  const fd = new FormData();
  fd.append('id', row.id);
  fd.append('name', name);
  fd.append('email', email);
  fd.append('level', level);

  try {
    const res = await fetch('/edu_ai/admin_user_update.php', { method: 'POST', body: fd, credentials: 'same-origin' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Failed to update user');

    // update in memory
    users[index].name  = name;
    users[index].email = email;
    users[index].level = level;
    closeEditModal();
    renderUsers();
    fetchUsers();
  } catch (e) {
    console.error(e);
    alert(e.message || 'Could not update user.');
  }
}

async function deleteUser(index) {
  const row = users[index];
  if (!row) return;
  if (!confirm(`Delete ${row.name}?`)) return;

  const fd = new FormData();
  fd.append('id', row.id);

  try {
    const res = await fetch('/edu_ai/admin_user_delete.php', { method: 'POST', body: fd, credentials: 'same-origin' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Failed to delete user');

    users.splice(index, 1);
    renderUsers();
    fetchUsers();
  } catch (e) {
    console.error(e);
    alert(e.message || 'Could not delete user.');
  }
}

window.onclick = function(event) {
  const modals = ["userModal", "editUserModal"];
  modals.forEach(id => {
    const modal = document.getElementById(id);
    if (event.target === modal) modal.style.display = "none";
  });
};

function filterUsers(level) {
  const table = document.getElementById("userTable");
  const rows = table.getElementsByTagName("tr");
  for (let i = 0; i < rows.length; i++) {
    const cells = rows[i].getElementsByTagName("td");
    if (cells.length > 0) {
      const userLevel = cells[2].innerText;
      rows[i].style.display = (level === "All" || userLevel === level) ? "" : "none";
    }
  }
}

// prevent XSS in table
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// initial load
fetchUsers();
</script>

document.getElementById("dashboardBtn").addEventListener("click", () => {
    window.location.href = "/edu_ai/admin_dashboard.php";
});
</script>
