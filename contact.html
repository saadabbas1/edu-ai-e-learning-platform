<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Contact Us – Edu AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="home_page.css"> <!-- Reuses your style -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .contact-container {
            max-width: 600px;
            margin: 80px auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(0, 198, 255, 0.1);
            color: #222;
        }

        .contact-container h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 24px;
            font-weight: 600;
            background: linear-gradient(to right, #00c6ff, #007bff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .contact-container input,
        .contact-container textarea {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            background-color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
        }

        .contact-container button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #00c6ff, #007bff);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .contact-container button:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="navbar-left">
            <img src="images/Book Logo.png" alt="Edu AI Logo" class="logo">
            <span class="brand-name">Edu AI</span>
        </div>
        <nav class="nav-links" id="navMenu">
                <a href="home_page.html">Home</a>
                <a href="#">Contact Us</a>
                <a href="about.html">About Us</a>
                <a href="registration_form.html">Sign Up</a>
                <a href="login_form.html">Log In</a>
        </nav>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </header>

    <div class="contact-container">
        <h2>Contact Us</h2>
        <form>
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <input type="text" name="subject" placeholder="Subject" required>
            <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById("navMenu");
            menu.classList.toggle("active");
        }
    </script>
</body>
</html>
