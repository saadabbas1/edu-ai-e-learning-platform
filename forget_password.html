<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password | Edu AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .auth-box {
      position: relative;
      width: 100%;
      max-width: 400px;
      background: #fff;
      padding: 3rem 2rem 2rem 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    .form-title {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #007bff;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 0.9rem 1rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 10px;
      transition: border-color 0.3s ease;
      margin-bottom: 0.5rem;
    }
    input:focus { border-color: #007bff; outline: none; }
    .password-group { position: relative; display: flex; align-items: center; }
    .password-group input { width: 100%; padding-right: 60px; }
    .toggle-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #007bff;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      height: 100%;
    }
    .toggle-btn:hover { color: #0056b3; }
    button {
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
      user-select: none;
      border: none;
      padding: 0.9rem;
      box-sizing: border-box;
    }
    .button-primary {
      background-color: #007bff;
      color: #fff;
      width: 100%;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }
    .button-primary:hover { background-color: #0056b3; }
    .back-button {
      position: absolute;
      top: 16px;
      left: 16px;
      background: none;
      color: #007bff;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 10px;
      padding: 0.5rem 0.9rem;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
    }
    .back-button:hover {
      background-color: #e6f0ff;
      color: #0056b3;
      transform: translateX(-2px);
    }
    .message { font-size: 0.9rem; min-height: 1.2em; margin-top: 0.25rem; margin-bottom: 0.8rem; }
    .message.error { color: #dc3545; }
    .message.success { color: #28a745; }
    .message.warning { color: #fd7e14; }
    #passwordStrength { margin-bottom: 0.5rem; }
    #passwordMatch { margin-bottom: 1rem; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- Email Form -->
  <div class="auth-box" id="emailBox">
    <button class="back-button" onclick="goBackToLogin()">← Back</button>
    <p class="form-title">Reset Password</p>
    <input type="email" id="resetEmail" placeholder="Enter your email" required />
    <div id="emailMessage" class="message"></div>
    <button class="button-primary" id="emailSubmitBtn">Submit</button>
  </div>

  <!-- OTP Form -->
  <div class="auth-box hidden" id="otpBox">
    <button class="back-button" onclick="goBackToEmail()">← Back</button>
    <p class="form-title">Enter OTP</p>
    <input type="text" id="otpInput" placeholder="Enter the OTP sent to your email" required />
    <div id="otpMessage" class="message"></div>
    <button class="button-primary" id="otpConfirmBtn">Confirm</button>
  </div>

  <!-- Password Reset Form -->
  <div class="auth-box hidden" id="passwordBox">
    <button class="back-button" onclick="goBackToOTP()">← Back</button>
    <p class="form-title">Set New Password</p>

    <div class="password-group">
      <input type="password" id="newPassword" name="newPassword" placeholder="New Password" required />
      <button type="button" class="toggle-btn" onclick="togglePassword('newPassword', this)">Show</button>
    </div>
    <div id="passwordStrength" class="message"></div>

    <div class="password-group">
      <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required />
      <button type="button" class="toggle-btn" onclick="togglePassword('confirmPassword', this)">Show</button>
    </div class="password-group">
    <div id="passwordMatch" class="message"></div>
    <div id="passwordMessage" class="message"></div>
    <button class="button-primary" id="passwordSaveBtn">Save</button>
  </div>

  <script>
/* ============ Helpers ============ */
const $ = (id) => document.getElementById(id);

async function postJSON(url, data) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });

  const text = await res.text();
  try {
    return JSON.parse(text);
  } catch {
    console.error('RAW RESPONSE:', text);
    return { ok:false, error:'Invalid JSON response' };
  }
}

/* ============ Cached elements (match your IDs) ============ */
const emailBox = $('emailBox');
const otpBox = $('otpBox');
const passwordBox = $('passwordBox');

const resetEmailInput = $('resetEmail');
const emailMessage = $('emailMessage');
const emailSubmitBtn = $('emailSubmitBtn');

const otpInput = $('otpInput');
const otpMessage = $('otpMessage');
const otpConfirmBtn = $('otpConfirmBtn');

const newPasswordInput = $('newPassword');
const confirmPasswordInput = $('confirmPassword');
const passwordStrength = $('passwordStrength');
const passwordMatch = $('passwordMatch');
const passwordMessage = $('passwordMessage');
const passwordSaveBtn = $('passwordSaveBtn');

let RESET_TOKEN = null;

/* ============ Missing functions that UI calls ============ */
function goBackToLogin() {
  // You can change the target if your login page name differs.
  location.href = 'login_form.html';
}

function togglePassword(inputId, btn) {
  const input = $(inputId);
  if (!input) return;
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  btn.textContent = isHidden ? 'Hide' : 'Show';
}

/* ============ Back buttons ============ */
function goBackToEmail() {
  otpBox.classList.add('hidden');
  emailBox.classList.remove('hidden');
  otpMessage.textContent = '';
  otpInput.value = '';
}
function goBackToOTP() {
  passwordBox.classList.add('hidden');
  otpBox.classList.remove('hidden');
  passwordStrength.textContent = '';
  passwordMatch.textContent = '';
  passwordMessage.textContent = '';
  newPasswordInput.value = '';
  confirmPasswordInput.value = '';
}

/* ============ Password strength/match ============ */
function checkPasswordStrength(pwd) {
  const long = pwd.length >= 8;
  const up   = /[A-Z]/.test(pwd);
  const num  = /\d/.test(pwd);
  if (long && up && num) return 'strong';
  if (long && (up || num)) return 'average';
  return 'weak';
}
function updatePasswordStrength() {
  const pwd = newPasswordInput.value;
  if (!pwd) { passwordStrength.textContent = ''; passwordStrength.className = 'message'; return; }
  const s = checkPasswordStrength(pwd);
  passwordStrength.textContent = 'Strength: ' + s[0].toUpperCase() + s.slice(1);
  passwordStrength.className = 'message ' + (s==='weak' ? 'error' : (s==='average' ? 'warning':'success'));
}
function checkPasswordMatch() {
  const a = newPasswordInput.value, b = confirmPasswordInput.value;
  if (!b) { passwordMatch.textContent=''; passwordMatch.className='message'; return; }
  if (a===b) { passwordMatch.textContent='Passwords match'; passwordMatch.className='message success'; }
  else { passwordMatch.textContent='Passwords do not match'; passwordMatch.className='message error'; }
}

/* live feedback (no UI changes) */
newPasswordInput.addEventListener('input', () => { updatePasswordStrength(); checkPasswordMatch(); });
confirmPasswordInput.addEventListener('input', checkPasswordMatch);

/* ============ Step 1: Send OTP ============ */
async function sendOTP(e){
  e?.preventDefault?.();
  const email = resetEmailInput.value.trim();
  emailMessage.textContent = ''; emailMessage.className = 'message';

  if (!email) { emailMessage.textContent='Email is required.'; emailMessage.className='message error'; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { emailMessage.textContent='Enter a valid email.'; emailMessage.className='message error'; return; }

  emailMessage.textContent = 'Sending OTP...'; emailMessage.className='message success';
  const j = await postJSON('/edu_ai/api/request_reset.php', { email });
  if (!j.ok) { emailMessage.textContent = j.error || j.raw || 'Could not send OTP'; emailMessage.className='message error'; return; }

  emailMessage.textContent = 'OTP sent to your email ✔'; emailMessage.className='message success';
  emailBox.classList.add('hidden'); otpBox.classList.remove('hidden');
  otpInput.focus();
}

/* ============ Step 2: Verify OTP ============ */
async function verifyOTP(e){
  e?.preventDefault?.();
  const email = resetEmailInput.value.trim();
  const otp   = otpInput.value.trim();
  otpMessage.textContent=''; otpMessage.className='message';

  if (!otp) { otpMessage.textContent='Enter the OTP.'; otpMessage.className='message error'; return; }

  otpMessage.textContent='Verifying...'; otpMessage.className='message success';

  // ✅ FIX: edu_ai (you had edi_ai)
  const j = await postJSON('/edu_ai/api/verify_otp.php', { email, otp });

  if (!j.ok || !j.reset_token) { otpMessage.textContent=j.error || j.raw || 'Invalid OTP'; otpMessage.className='message error'; return; }

  RESET_TOKEN = j.reset_token;
  otpMessage.textContent='OTP verified ✔'; otpMessage.className='message success';
  otpBox.classList.add('hidden'); passwordBox.classList.remove('hidden');
  newPasswordInput.focus();
}

/* ============ Step 3: Save new password ============ */
async function saveNewPassword(e){
  e?.preventDefault?.();
  const email = resetEmailInput.value.trim();
  const pwd   = newPasswordInput.value;
  const cpwd  = confirmPasswordInput.value;
  passwordMessage.textContent=''; passwordMessage.className='message';

  if (pwd !== cpwd) { passwordMessage.textContent='Passwords do not match.'; passwordMessage.className='message error'; return; }
  if (checkPasswordStrength(pwd) !== 'strong') {
    passwordMessage.textContent='Password must be 8+ chars, include 1 uppercase and 1 number.';
    passwordMessage.className='message error'; return;
  }
  if (!RESET_TOKEN) { passwordMessage.textContent='Session expired. Request new OTP.'; passwordMessage.className='message error'; return; }

  passwordMessage.textContent='Updating password...'; passwordMessage.className='message success';
  const j = await postJSON('/edu_ai/api/reset_password.php', { email, reset_token: RESET_TOKEN, password: pwd });
  if (!j.ok) { passwordMessage.textContent=j.error || j.raw || 'Reset failed'; passwordMessage.className='message error'; return; }

  passwordMessage.textContent='Password reset successfully! Redirecting to login…'; passwordMessage.className='message success';
  setTimeout(()=> location.href='login_form.html', 1200);
}

/* ============ Wire buttons + Enter keys ============ */
emailSubmitBtn.addEventListener('click', (e)=>{ e.preventDefault(); sendOTP(e); });
otpConfirmBtn.addEventListener('click', (e)=>{ e.preventDefault(); verifyOTP(e); });
passwordSaveBtn.addEventListener('click', (e)=>{ e.preventDefault(); saveNewPassword(e); });

resetEmailInput.addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); sendOTP(e); }});
otpInput.addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); verifyOTP(e); }});
confirmPasswordInput.addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); saveNewPassword(e); }});
  </script>

</body>
</html>
